  <g filter="url(#cw-spark-glow)">
    <path d="M 252.5 54.0 Q 253.3 60.4 259.7 61.2 Q 253.3 62.0 252.5 68.4 Q 251.7 62.0 245.3 61.2 Q 251.7 60.4 252.5 54.0 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.45" stroke-linejoin="round"/>
