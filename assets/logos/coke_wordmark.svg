<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 296 112" width="296" height="112" role="img" aria-label="Coke">
  <defs>
    <filter id="cw-shadow" x="-18%" y="-25%" width="140%" height="155%">
      <feDropShadow dx="0" dy="1.1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.27"/>
    </filter>
    <filter id="cw-spark-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.4" flood-color="#60A5FA" flood-opacity="0.85"/>
    </filter>
    <linearGradient id="cw-snow-grad" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="76%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6EEF8"/>
    </linearGradient>
    <linearGradient id="cw-pile-grad" x1="20%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="72%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E4EDF7"/>
    </linearGradient>
  </defs>

  <!-- Wordmark text matching hero typography -->
  <text x="2" y="90" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="100" letter-spacing="-0.03em" fill="currentColor">Coke</text>

  <!-- Sculpted wet-snow cap draping over capital C -->
