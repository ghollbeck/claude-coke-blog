    <path d="M 14 23.5 C 15.5 17.5, 23 14, 29.5 12.8 C 34 8.2, 43.5 7.8, 48.5 12.2 C 56 12.6, 64 15.2, 67.5 19.8 C 68.5 21.2, 66.8 23.0, 64.2 22.4 C 60.5 21.6, 56.8 22.0, 54.6 24.4 C 53.0 26.2, 52.8 29.5, 50.0 29.5 C 47.4 29.5, 47.5 25.0, 44.5 23.4 C 40.5 21.4, 34.0 21.8, 29.2 23.2 C 26.6 24.0, 25.4 26.0, 23.5 25.8 C 21.5 25.6, 21.0 23.2, 18.2 23.8 C 16.0 24.2, 13.6 24.8, 14 23.5 Z" fill="url(#cw-snow-grad)" stroke="#CBD5E1" stroke-width="0.75" stroke-linejoin="round"/>
